version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_SECURE_COOKIE=true
      - N8N_PERSONALIZATION_ENABLED=true
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ttyd:
    image: tsl0922/ttyd:latest
    restart: unless-stopped
    command:
      - ttyd
      - --writable
      - --base-path
      - /terminal
      - --credential
      - ${TTYD_USER:-admin}:${TTYD_PASSWORD:?Set TTYD_PASSWORD in .env}
      - bash
    volumes:
      - workspace:/workspace
    working_dir: /workspace
    networks:
      - n8n-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - n8n-net
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
  workspace:

networks:
  n8n-net:
